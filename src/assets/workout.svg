<svg width="900" height="640" viewBox="0 0 900 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Workout planner illustration</title>
  <desc id="desc">A simple illustration of a laptop showing a weekly workout plan with a dumbbell and water bottle.</desc>
  <rect width="900" height="640" rx="40" fill="#F8FBFF"/>
  <path d="M570 70C690 55 815 130 835 260C856 390 765 520 625 545C485 570 325 510 280 390C235 270 450 85 570 70Z" fill="#EAF6FF"/>
  <ellipse cx="485" cy="540" rx="315" ry="34" fill="#DBEAFE" fill-opacity="0.55"/>

  <!-- laptop base -->
  <path d="M205 468H695L760 540H145L205 468Z" fill="#CBD5E1"/>
  <path d="M230 484H670L710 526H190L230 484Z" fill="#E2E8F0"/>
  <rect x="365" y="507" width="170" height="13" rx="6.5" fill="#94A3B8" fill-opacity="0.45"/>

  <!-- laptop screen -->
  <rect x="220" y="120" width="470" height="345" rx="22" fill="#0F172A"/>
  <rect x="241" y="145" width="428" height="294" rx="12" fill="white"/>

  <!-- screen content -->
  <text x="275" y="195" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">This Week</text>
  <rect x="575" y="168" width="48" height="48" rx="12" fill="#ECFEFF" stroke="#67E8F9" stroke-width="2"/>
  <rect x="589" y="195" width="6" height="16" rx="3" fill="#14B8A6"/>
  <rect x="601" y="184" width="6" height="27" rx="3" fill="#14B8A6"/>
  <rect x="613" y="176" width="6" height="35" rx="3" fill="#14B8A6"/>

  <g font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155">
    <text x="278" y="250">Mon</text><text x="360" y="250">Push</text>
    <text x="278" y="295">Tue</text><text x="360" y="295">Pull</text>
    <text x="278" y="340">Wed</text><text x="360" y="340">Legs</text>
    <text x="278" y="385">Thu</text><text x="360" y="385">Rest</text>
    <text x="278" y="430">Fri</text><text x="360" y="430">Push</text>
  </g>

  <g>
    <circle cx="330" cy="244" r="15" fill="#14B8A6"/><path d="M323 244L328 249L337 238" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="330" cy="289" r="15" fill="#14B8A6"/><path d="M323 289L328 294L337 283" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="330" cy="334" r="15" fill="#14B8A6"/><path d="M323 334L328 339L337 328" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="330" cy="379" r="15" fill="#14B8A6"/><path d="M323 379L328 384L337 373" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="330" cy="424" r="15" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
  </g>

  <g>
    <rect x="475" y="235" width="150" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="475" y="235" width="122" height="8" rx="4" fill="#14B8A6"/>
    <rect x="475" y="280" width="150" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="475" y="280" width="105" height="8" rx="4" fill="#14B8A6"/>
    <rect x="475" y="325" width="150" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="475" y="325" width="90" height="8" rx="4" fill="#14B8A6"/>
    <rect x="475" y="370" width="150" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="475" y="370" width="72" height="8" rx="4" fill="#14B8A6"/>
    <rect x="475" y="415" width="150" height="8" rx="4" fill="#E2E8F0"/>
  </g>

  <!-- bottle -->
  <rect x="700" y="295" width="72" height="190" rx="26" fill="#14B8A6"/>
  <rect x="706" y="318" width="60" height="155" rx="22" fill="#2DD4BF"/>
  <rect x="717" y="267" width="38" height="35" rx="10" fill="#1E293B"/>
  <path d="M714 270C714 245 758 245 758 270" stroke="#1E293B" stroke-width="14" stroke-linecap="round"/>
  <path d="M723 380L750 407M750 380L723 407" stroke="white" stroke-width="5" stroke-linecap="round"/>

  <!-- dumbbell -->
  <rect x="610" y="468" width="130" height="28" rx="14" transform="rotate(-8 610 468)" fill="#334155"/>
  <path d="M579 439L637 431L665 466L644 509L586 517L558 482L579 439Z" fill="#1E293B"/>
  <path d="M723 420L781 412L809 447L788 490L730 498L702 463L723 420Z" fill="#1E293B"/>
  <path d="M594 457L628 452L644 471L631 493L597 498L581 479L594 457Z" fill="#334155"/>
  <path d="M738 438L772 433L788 452L775 474L741 479L725 460L738 438Z" fill="#334155"/>
</svg>
